version: '3.8'

services:
  bot:
    build: .
    container_name: gift_market_bot
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    command: >
      sh -c "alembic upgrade head && python main.py"

  postgres:
    image: postgres:16
    container_name: gift_market_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-gift_market}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: gift_market_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata: